# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idcc-test-service-account

---
# Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idcc-test-service-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idcc-test-service-role-binding
subjects:
  - kind: ServiceAccount
    name: idcc-test-service-account
roleRef:
  kind: Role
  name: idcc-test-service-role
  apiGroup: rbac.authorization.k8s.io

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idcc-test-service
  labels:
    app: idcc-test-service
spec:
  replicas: 6
  selector:
    matchLabels:
      app: idcc-test-service
  template:
    metadata:
      name: idcc-test-service
      labels:
        app: idcc-test-service
    spec:
      serviceAccountName: idcc-test-service-account
      containers:
        - name: service
          image: idcc
          imagePullPolicy: IfNotPresent
          env:
            - name: DOTNET_HTTP_PORTS
              value: "5000"
          ports:
            - containerPort: 5000
              protocol: TCP
            - containerPort: 5100
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: idcc-test-service
  labels:
    app: idcc-test-service
spec:
  type: NodePort
  selector:
    app: idcc-test-service
  ports:
    - protocol: TCP
      port: 5000
      nodePort: 30000
